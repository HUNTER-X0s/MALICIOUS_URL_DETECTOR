version: '3.9'

services:
  nginx:
    image: nginx:alpine
    container_name: urlsentinel_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api

  postgres:
    image: postgres:16-alpine
    container_name: urlsentinel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: urlsentinel
      POSTGRES_USER: urlsentinel
      POSTGRES_PASSWORD: dev_password_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U urlsentinel" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: urlsentinel_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass dev_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "dev_redis_password", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: urlsentinel_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://urlsentinel:dev_password_change_in_prod@postgres:5432/urlsentinel
      REDIS_URL: redis://:dev_redis_password@redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production-min-32-chars
      DEBUG: "false"
      LOG_LEVEL: INFO
      ALLOWED_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/api/src:/app/src

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: urlsentinel_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
