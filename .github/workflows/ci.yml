name: URLSentinel Continuous Integration & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Test Suite & Security Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: services/api/src
        run: |
          pytest services/api/tests tests/e2e tests/security tests/performance -v --cov=urlsentinel --cov-report=term-missing

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: Build Next.js Web App
        working-directory: apps/web
        run: npm run build

  extension-package:
    name: Browser Extension Package & Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Manifest V3 Structure
        run: |
          test -f apps/extension/manifest.json
          test -f apps/extension/background.js
          test -f apps/extension/popup.html
          test -f apps/extension/warning.html

      - name: Package Extension
        run: |
          mkdir -p dist
          cd apps/extension && zip -r ../../dist/urlsentinel-extension.zip . -x "*.git*"

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: urlsentinel-extension-v3
          path: dist/urlsentinel-extension.zip

